[project]
name = "bench-ui"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "bench-contracts",
    "matplotlib>=3.9,<4",
    "uagents-core==0.4.12",
]

[tool.uv.sources]
bench-contracts = { path = "../contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench_ui"]
