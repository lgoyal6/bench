[project]
name = "bench-cli"
version = "0.1.0"
description = "The bench command: verify tasks, run contestants, replay runs, check live integrations"
requires-python = ">=3.10"
dependencies = ["bench-contracts", "bench-rig"]

[project.scripts]
bench = "bench_cli.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
bench-contracts = { path = "../contracts", editable = true }
bench-rig = { path = "../rig", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench_cli"]
