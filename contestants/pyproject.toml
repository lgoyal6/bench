[project]
name = "bench-contestants"
version = "0.1.0"
description = "Contestant drivers for Bench (Devin, Claude Code), implementing the Contestant contract"
requires-python = ">=3.10"
dependencies = ["bench-contracts", "httpx>=0.27"]

[project.entry-points."bench.healthchecks"]
devin = "bench_contestants.devin_api:DevinHealth"
claude-code = "bench_contestants.claude_code:ClaudeCodeHealth"

# `bench compete --contestant <name>` loads one of these zero-argument factories.
[project.entry-points."bench.contestants"]
devin-api = "bench_contestants.devin_api:from_env"
claude-code = "bench_contestants.claude_code:from_env"

[dependency-groups]
dev = ["pytest>=8", "bench-rig"]

[tool.uv.sources]
bench-contracts = { path = "../contracts", editable = true }
bench-rig = { path = "../rig", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench_contestants"]
