[project]
name = "bench-contestants"
version = "0.1.0"
description = "Contestant drivers for Bench (Devin and others), implementing the Contestant contract"
requires-python = ">=3.10"
dependencies = ["bench-contracts", "httpx>=0.27"]

[project.entry-points."bench.healthchecks"]
devin = "bench_contestants.devin_api:DevinHealth"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
bench-contracts = { path = "../contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench_contestants"]
