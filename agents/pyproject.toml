[project]
name = "bench-market"
version = "0.1.0"
description = "Bench's Fetch market agents"
requires-python = ">=3.10"
dependencies = ["bench-contracts", "bench-ui", "uagents==0.25.5", "httpx>=0.27,<1", "pyyaml>=6,<7"]

[project.optional-dependencies]
execution = ["bench-rig", "bench-contestants", "bench-data"]

[project.scripts]
bench-market = "bench_agents.runtime:main"
bench-chaos = "bench_agents.chaos:main"
bench-analytics = "bench_agents.export:main"

[project.entry-points."bench.healthchecks"]
market = "bench_agents.health:MarketHealth"
payments = "bench_agents.health:PaymentHealth"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]

[tool.uv.sources]
bench-contracts = { path = "../contracts", editable = true }
bench-ui = { path = "../ui", editable = true }
bench-rig = { path = "../rig", editable = true }
bench-contestants = { path = "../contestants", editable = true }
bench-data = { path = "../data", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench_agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
