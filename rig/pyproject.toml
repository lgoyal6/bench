[project]
name = "bench-rig"
version = "0.1.0"
description = "Bench's QNX rig: builds, runs, times and faults contestant code on a Raspberry Pi 5"
requires-python = ">=3.10"
dependencies = ["bench-contracts", "pydantic>=2.6", "pyyaml>=6"]

[project.entry-points."bench.healthchecks"]
rig = "bench_rig.runner:rig_health_check"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
bench-contracts = { path = "../contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench_rig"]
