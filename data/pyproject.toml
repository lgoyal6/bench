[project]
name = "bench-data"
version = "0.1.0"
description = "Explicit ingestion of contract-backed Bench runs"
requires-python = ">=3.10"
dependencies = [
    "bench-contracts",
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.2,<4",
    "sentry-sdk>=2.72,<3",
]

[project.scripts]
bench-data = "bench_data.runtime:main"

[project.entry-points."bench.healthchecks"]
tiger = "bench_data.health:TigerHealth"
snowflake = "bench_data.health:SnowflakeHealth"
sentry = "bench_data.health:SentryHealth"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "pglast>=7", "sqlglot>=26"]

[tool.uv.sources]
bench-contracts = { path = "../contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench_data"]

[tool.hatch.build.targets.wheel.force-include]
"sql" = "bench_data/sql"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
