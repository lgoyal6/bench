; Bench firmware for the M5Stack StackChan (CoreS3, ESP32-S3).
; Build and flash: pio run -t upload --upload-port /dev/cu.usbmodemXXXX
[env:stackchan]
platform = espressif32@6.9.0
board = m5stack-cores3
framework = arduino
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    m5stack/M5Unified@0.2.26
monitor_speed = 115200
