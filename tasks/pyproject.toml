requires-python = ">=3.10"
dependencies = ["bench-rig"]

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6"]

[tool.uv]
package = false

[tool.uv.sources]
bench-rig = { path = "../rig", editable = true }
